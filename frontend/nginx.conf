server {
    listen 80;
    root /usr/share/nginx/html;

    # Django: the API, the admin and their static files
    location ~ ^/(api|admin|static)/ {
        proxy_pass http://be:8000;
        # Keep the browser's host, so Django's CSRF check sees one origin
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Syncs answer only once the provider has
        proxy_read_timeout 300s;
        # Uploaded credential files
        client_max_body_size 1m;
    }

    # The UI's routes are handled in the browser (vue-router)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
