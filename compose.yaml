# CloudHop with everything it needs: docker compose up --build, then open http://localhost:8080
# Ports are published on localhost only. Override any ${VAR} in a .env file next to this one.
# http_proxy, https_proxy and no_proxy are passed on from the shell, for building and for reaching the cloud.

# Docker does not keep these build args in the image
x-proxy-args: &proxy-args
  http_proxy: ${http_proxy:-}
  https_proxy: ${https_proxy:-}
  no_proxy: ${no_proxy:-}

x-backend: &backend
  build:
    context: .
    args: *proxy-args
  image: cloudhop-backend
  restart: unless-stopped
  environment:
    # GCP and cluster APIs go through the proxy; the other services do not
    http_proxy: ${http_proxy:-}
    https_proxy: ${https_proxy:-}
    no_proxy: ${no_proxy:-},postgres,redis,be
    DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-django-insecure-compose-only-change-me}
    DJANGO_DEBUG: "false"
    DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
    POSTGRES_HOST: postgres
    POSTGRES_DB: ${POSTGRES_DB:-cloudhop}
    POSTGRES_USER: ${POSTGRES_USER:-cloudhop}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cloudhop}
    CELERY_BROKER_URL: redis://redis:6379/0
  volumes:
    # Uploaded service account keys
    - credentials:/app/credentials
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cloudhop}
      POSTGRES_USER: ${POSTGRES_USER:-cloudhop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cloudhop}
    volumes:
      - postgres:/var/lib/postgresql/data
    ports:
      # For running Django outside compose
      - 127.0.0.1:${POSTGRES_PORT:-5432}:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      # For running Celery outside compose
      - 127.0.0.1:${REDIS_PORT:-6379}:6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Applies migrations once, before the backend and Celery start
  migrate:
    <<: *backend
    restart: "no"
    command: ["python", "manage.py", "migrate", "--noinput"]
    depends_on:
      postgres:
        condition: service_healthy

  be:
    <<: *backend

  celery-worker:
    <<: *backend
    command: ["celery", "-A", "cloudhop", "worker", "--concurrency", "2", "--loglevel", "info"]

  # Queues the syncs every SYNC_INTERVAL_MINUTES; run exactly one
  celery-beat:
    <<: *backend
    command: ["celery", "-A", "cloudhop", "beat", "--loglevel", "info", "--schedule", "/tmp/celerybeat-schedule"]
    volumes: []

  fe:
    build:
      context: ./frontend
      args: *proxy-args
    image: cloudhop-frontend
    restart: unless-stopped
    ports:
      - 127.0.0.1:${FE_PORT:-8080}:80
    depends_on:
      - be

volumes:
  postgres:
  credentials:
